        - endDate
        - daysUntilExpiry
        - status

    RecruitmentPipelineItem:
      type: object
      properties:
        status:
          type: string
        count:
          type: integer
      required:
        - status
        - count

    # AI Request/Response Schemas
    ParseCvRequest:
      type: object
      properties:
        candidateId:
          type: integer
          description: The candidate whose CV to parse. The server uses the candidate's uploaded document from storage when available.
        cvUrl:
          type: string
          description: >
            Optional external HTTPS URL of a CV document (PDF or plain text) to parse.
            When provided, the server downloads and extracts text from this URL.
            Must be an absolute HTTPS URL; internal storage paths are not accepted here.
            If omitted, the server uses the candidate's uploaded document on record.
        cvText:
          type: string
          description: Raw CV text to parse. Used as fallback when no document URL is available.
      required:
        - candidateId

    ParsedCvData:
      type: object
      properties:
        name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        experience:
          type: array
          items:
            type: string
        education:
          type: array
          items:
            type: string
        summary:
          type: ["string", "null"]
      required:
        - skills
        - experience
        - education

    RankCandidatesRequest:
      type: object
      properties:
        jobId:
          type: integer
      required:
        - jobId

    RankedCandidate:
      type: object
      properties:
        candidateId:
          type: integer
        candidateName:
          type: string
        score:
          type: number
        recommendation:
          type: string
        applicationId:
          type: integer
      required:
        - candidateId
        - candidateName
        - score
        - recommendation

    InterviewQuestionsRequest:
      type: object
      properties:
        jobId:
          type: integer
        candidateId:
          type: integer
      required:
        - jobId
        - candidateId

    InterviewQuestionsResponse:
      type: object
      properties:
        questions:
          type: array
          items:
            type: string
        jobTitle:
          type: string
      required:
        - questions
        - jobTitle

    WorkforcePrediction:
      type: object
      properties:
        attritionRisk:
          type: array
          items:
            $ref: "#/components/schemas/AttritionRiskItem"
        predictedVacancies:
          type: array
          items:
            $ref: "#/components/schemas/PredictedVacancyItem"
        recommendations:
          type: array
          items:
            type: string
      required:
        - attritionRisk
        - predictedVacancies
        - recommendations

    AttritionRiskItem:
      type: object
      properties:
        departmentName:
          type: string
        riskLevel:
          type: string
        staffAtRisk:
          type: integer
        reason:
          type: string
      required:
        - departmentName
        - riskLevel
        - staffAtRisk
        - reason

    PredictedVacancyItem:
      type: object
      properties:
        departmentName:
          type: string
        predictedVacancies:
          type: integer
        timeframe:
          type: string
        confidence:
          type: string
      required:
        - departmentName
        - predictedVacancies
        - timeframe

    UserWithRole:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        roleId:
          type: ["integer", "null"]
        roleName:
          type: ["string", "null"]
        agencyId:
          type: ["integer", "null"]
        status:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - status

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        roleId:
          type: integer
      required:
        - name
        - email
        - password
        - roleId

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        roleId:
          type: integer
        status:
          type: string
          enum: [active, inactive]

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
        - id
        - name

    # Storage Schemas
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string

    # Notification Schemas
    Notification:
      type: object
      required: [id, userId, type, message, read, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
        message:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
