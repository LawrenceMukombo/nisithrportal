  # Storage Endpoints
  /upload:
    post:
      tags: [storage]
      operationId: uploadFile
      summary: Upload a document file (CV, certificate, contract)
      description: >
        Public multipart upload endpoint for applicants submitting CVs during job application.
        Accepts a single file via multipart/form-data. Allowed types: PDF, DOC, DOCX (max 10 MB).
        Authentication is NOT required — enables unauthenticated applicants to attach CVs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, jobId]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload (PDF, DOC, or DOCX, max 10 MB)
                jobId:
                  type: integer
                  description: ID of the job being applied to. Used to derive the owning agency for tenant-scoped ACL.
      responses:
        "200":
          description: File uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                required: [url, objectPath]
                properties:
                  url:
                    type: string
                    description: Serving URL for the uploaded file via /api/storage/objects/*
                  objectPath:
                    type: string
                    description: Internal object path for reference
        "400":
          description: No file uploaded or invalid file type/size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to store file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for direct file upload (HR staff only)
      description: >
        Returns a GCS presigned PUT URL for direct client-to-GCS upload.
        Restricted to HR staff roles. After uploading, call POST /storage/uploads/confirm
        to apply tenant ACL so the file is retrievable via GET /storage/objects/*.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/confirm:
    post:
      tags: [storage]
      operationId: confirmUpload
      summary: Apply tenant ACL to a staff-uploaded object
      description: >
        After uploading a file via the presigned URL returned by POST /storage/uploads/request-url,
        call this endpoint to apply the tenant ACL (sets the calling user's agency as the owner).
        Without this step, the file is not retrievable via GET /storage/objects/*.
        Restricted to HR staff roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectPath]
              properties:
                objectPath:
                  type: string
                  description: The objectPath returned by POST /storage/uploads/request-url
      responses:
        "200":
          description: ACL applied. Object is now retrievable by agency members.
          content:
            application/json:
              schema:
                type: object
                required: [objectPath, owner]
                properties:
                  objectPath:
                    type: string
                  owner:
                    type: string
                    description: The agencyId set as the ACL owner
        "400":
          description: Missing objectPath or user has no agency assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Object not found (file not yet uploaded to GCS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to apply ACL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an uploaded object entity (HR staff only)
      description: >
        Returns the raw file content for private uploaded objects (CVs, contracts, certificates).
        Restricted to authenticated HR staff roles: admin, hr_officer, hiring_manager, executive.
        Applicants and unauthenticated users receive 401/403.
      security:
        - bearerAuth: []
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Notification Endpoints
  /notifications:
    get:
      tags: [notifications]
      operationId: getNotifications
      summary: Get current user's notifications
      security:
        - bearerAuth: []
      description: Returns the current user's unread notifications by default. Pass all=true to include read notifications.
      parameters:
        - name: all
          in: query
          description: If true, returns all notifications (read and unread). Default is false (unread only).
          schema:
            type: boolean
      responses:
        "200":
          description: List of notifications (unread only by default)
          content:
