  /jobs/{id}/publish:
    patch:
      operationId: publishJob
      tags: [jobs]
      summary: Publish a job vacancy
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{id}/close:
    patch:
      operationId: closeJob
      tags: [jobs]
      summary: Close a job vacancy
      security:
        - bearerAuth: []
