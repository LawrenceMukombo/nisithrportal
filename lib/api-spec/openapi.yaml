                  count:
                    type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ScreeningQuestion:
      type: object
      properties:
        id:
          type: integer
        jobId:
          type: integer
        question:
          type: string
        questionType:
          type: string
          enum: [short_answer, yes_no, multiple_choice, numeric]
        options:
          type: array
          items:
            type: string
          nullable: true
        required:
          type: boolean
        isMandatoryFilter:
          type: boolean
        autoReject:
          type: boolean
        autoRejectValue:
          type: ["string", "null"]
        displayOrder:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateScreeningQuestionRequest:
      type: object
      required: [question, questionType]
      properties:
        question:
          type: string
        questionType:
          type: string
          enum: [short_answer, yes_no, multiple_choice, numeric]
        options:
          type: array
          items:
            type: string
        required:
          type: boolean
          default: true
        isMandatoryFilter:
          type: boolean
          default: false
        autoReject:
          type: boolean
          default: false
        autoRejectValue:
          type: string
        displayOrder:
          type: integer

    # Auth Schemas
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        agencyName:
          type: string
        agencyType:
          type: string
        roleName:
          type: string
      required:
        - name
        - email
        - password
        - agencyName

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - user

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
